[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesafeclaw"
version = "1.0.0"
description = "Fully local, secure desktop voice assistant — controls your entire computer by voice, zero cloud."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "VoiceSafeClaw Team" }]
keywords = ["voice-assistant", "local-ai", "desktop", "privacy", "safeclaw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "openwakeword>=0.5.1",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "onnxruntime>=1.17.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "pyautogui>=0.9.54",
    "psutil>=5.9.8",
    "pyperclip>=1.8.2",
    "playwright>=1.41.0",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10.1", "pyobjc-framework-Quartz>=10.1"]
windows = ["pywin32>=306", "comtypes>=1.3.1"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-mock>=3.12.0", "pyinstaller>=6.3.0"]

[project.scripts]
voicesafeclaw = "core.engine:main"

[tool.setuptools.packages.find]
include = ["core*", "voice*", "skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
